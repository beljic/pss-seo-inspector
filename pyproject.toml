[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pss-seo-inspector"
version = "0.1.0"
description = "Read-only, platform-aware technical SEO audit MCP server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5.0",
    "httpx2>=2.12,<3.0",
    "mcp>=2.1.1,<2.2.0",
    "pydantic>=2.0,<3.0",
]

[project.scripts]
pss-seo-inspector = "pss_seo_inspector.server:main"

[dependency-groups]
dev = [
    "mypy>=1.10,<2.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pss_seo_inspector"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["_bmad", ".claude", ".venv", "docs", ".agents", "_bmad-output"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
